---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time>
  </header>

  {{ content }}
</article>

<nav class="page-navigation" aria-label="Navigasi catatan">
  <span>
    {% if page.next.url %}
      <a href="{{ site.baseurl }}{{ page.next.url }}" rel="next">← {{ page.next.title }}</a>
    {% endif %}
  </span>
  <a href="{{ site.baseurl }}/">Semua catatan</a>
  <span>
    {% if page.previous.url %}
      <a href="{{ site.baseurl }}{{ page.previous.url }}" rel="prev">{{ page.previous.title }} →</a>
    {% endif %}
  </span>
</nav>
